<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f5f0"><title>拾艺 · 世界名画</title>
<style>
:root{--paper:#f7f5f0;--ink:#20201d;--muted:#77756f;--line:#dedbd3;--accent:#a34c36;--serif:"Iowan Old Style","Noto Serif SC","Songti SC",serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}header{padding:24px 7vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font:600 20px var(--serif);letter-spacing:.18em}.brand small{font:10px Arial;display:block;color:var(--muted);letter-spacing:.28em;margin-top:5px}.top-note{font-size:12px;color:var(--muted);letter-spacing:.12em}.hero{padding:72px 7vw 42px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px}.eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:15px}.hero h1{font:400 clamp(36px,6vw,68px)/1.15 var(--serif);letter-spacing:.04em;margin:0}.hero p{font:15px/1.9 var(--serif);color:var(--muted);max-width:570px;margin:20px 0 0}.count{font:italic 14px var(--serif);color:var(--muted);padding-bottom:8px}.controls{margin:0 7vw 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}.tabs{display:flex;gap:27px;overflow:auto}.tab{white-space:nowrap;border:0;background:none;padding:14px 0 13px;color:var(--muted);font-size:13px;cursor:pointer;position:relative}.tab.active{color:var(--ink)}.tab.active:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent)}.hint{font-size:11px;color:#96938b;white-space:nowrap}.grid{padding:0 7vw 76px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:38px 22px}.card{min-width:0;cursor:zoom-in;group:card}.image-wrap{height:clamp(190px,24vw,330px);background:#e9e5dc;overflow:hidden;position:relative}.image-wrap img{height:100%;width:100%;object-fit:cover;display:block;transition:transform .55s cubic-bezier(.2,.7,.2,1);filter:saturate(.92)}.card:hover img{transform:scale(1.045)}.zoom{position:absolute;right:12px;bottom:12px;color:white;background:#171613a8;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;opacity:0;transition:opacity .2s}.card:hover .zoom{opacity:1}.meta{padding:15px 1px 0;display:flex;justify-content:space-between;align-items:start;gap:10px}.title{font:19px var(--serif);margin:0 0 6px}.artist{font-size:12px;color:var(--muted)}.year{font:italic 12px var(--serif);color:var(--muted);white-space:nowrap;padding-top:4px}.tag{font-size:10px;letter-spacing:.1em;color:var(--accent);margin-top:12px}.empty{grid-column:1/-1;color:var(--muted);padding:80px;text-align:center}.footer{border-top:1px solid var(--line);padding:22px 7vw;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:15px}.modal{position:fixed;inset:0;background:#171613ed;z-index:5;display:none;align-items:center;justify-content:center;padding:5vh 5vw}.modal.open{display:flex}.modal figure{margin:0;max-width:100%;max-height:90vh;display:flex;flex-direction:column;align-items:center}.modal img{max-width:88vw;max-height:76vh;object-fit:contain;box-shadow:0 18px 70px #0008}.caption{color:#f5f0e7;text-align:center;margin-top:15px;font:16px var(--serif)}.caption span{font:12px Arial;color:#bbb;display:block;margin-top:6px}.close{position:absolute;top:22px;right:28px;border:1px solid #ffffff55;background:transparent;color:white;font-size:25px;width:42px;height:42px;border-radius:50%;cursor:pointer}.nav{position:absolute;top:50%;transform:translateY(-50%);border:1px solid #ffffff55;color:white;background:#ffffff14;border-radius:50%;width:46px;height:46px;font-size:22px;cursor:pointer}.prev{left:22px}.next{right:22px}.modal-tip{position:absolute;bottom:18px;color:#ffffff88;font-size:11px;letter-spacing:.08em}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.image-wrap{height:30vw}}@media(max-width:650px){header{padding:18px 6vw}.top-note{display:none}.hero{padding:50px 6vw 30px;grid-template-columns:1fr}.count{padding:0}.controls{margin:0 6vw 20px}.hint{display:none}.tabs{gap:20px}.grid{padding:0 6vw 54px;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 14px}.image-wrap{height:52vw}.title{font-size:16px}.footer{padding:20px 6vw;display:block;line-height:1.8}.nav{width:38px;height:38px}.prev{left:8px}.next{right:8px}.modal{padding:5vh 12px}.modal img{max-width:94vw}}
</style>
</head>
<body>
<header><div class="brand">拾艺<small>ART, AT YOUR OWN PACE</small></div><div class="top-note">一场穿越时光的艺术漫游</div></header>
<main><section class="hero"><div><div class="eyebrow">THE MASTERPIECES COLLECTION</div><h1>世界名画，<br>慢慢看。</h1><p>从文艺复兴到现代主义，在一幅幅作品之间漫步。点击画作，即可沉浸式放大欣赏。</p></div><div class="count" id="count">01 — 08</div></section>
<div class="controls"><div class="tabs" role="tablist"><button class="tab active" data-filter="全部">全部作品</button><button class="tab" data-filter="文艺复兴">文艺复兴</button><button class="tab" data-filter="巴洛克">巴洛克</button><button class="tab" data-filter="印象派">印象派</button><button class="tab" data-filter="现代">现代</button></div><span class="hint">点击作品 · 放大细赏</span></div>
<section class="grid" id="grid" aria-label="名画作品"></section></main>
<footer class="footer"><span>拾艺 · 世界名画画廊</span><span>作品图片来自 Wikimedia Commons · 点击画作进入放大欣赏</span></footer>
<div class="modal" id="modal" aria-modal="true" role="dialog" aria-label="作品放大查看"><button class="close" aria-label="关闭">×</button><button class="nav prev" aria-label="上一幅">‹</button><figure><img id="modalImg" alt=""><figcaption class="caption" id="caption"></figcaption></figure><button class="nav next" aria-label="下一幅">›</button><div class="modal-tip">← → 切换作品　·　ESC 关闭</div></div>
<script>
const artworks=[
{title:'蒙娜丽莎',en:'Mona Lisa',artist:'列奥纳多·达·芬奇',year:'约 1503–1506',period:'文艺复兴',place:'卢浮宫 · 巴黎',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg?width=1200'},
{title:'最后的晚餐',en:'The Last Supper',artist:'列奥纳多·达·芬奇',year:'约 1495–1498',period:'文艺复兴',place:'圣玛利亚感恩教堂 · 米兰',img:'https://commons.wikimedia.org/wiki/Special:FilePath/The_Last_Supper_-_Leonardo_Da_Vinci_-_High_Resolution_32x16.jpg?width=1200'},
{title:'戴珍珠耳环的少女',en:'Girl with a Pearl Earring',artist:'约翰内斯·维米尔',year:'约 1665',period:'巴洛克',place:'莫瑞泰斯皇家美术馆 · 海牙',img:'https://commons.wikimedia.org/wiki/Special:FilePath/1665_Girl_with_a_Pearl_Earring.jpg?width=1200'},
{title:'夜巡',en:'The Night Watch',artist:'伦勃朗',year:'1642',period:'巴洛克',place:'国立博物馆 · 阿姆斯特丹',img:'https://commons.wikimedia.org/wiki/Special:FilePath/The_Nightwatch_by_Rembrandt.jpg?width=1200'},
{title:'睡莲',en:'Water Lilies',artist:'克劳德·莫奈',year:'约 1916–1919',period:'印象派',place:'橘园美术馆 · 巴黎',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Claude_Monet_-_Water_Lilies_-_1906,_Ryerson.jpg?width=1200'},
{title:'星月夜',en:'The Starry Night',artist:'文森特·梵高',year:'1889',period:'现代',place:'现代艺术博物馆 · 纽约',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg?width=1200'},
{title:'呐喊',en:'The Scream',artist:'爱德华·蒙克',year:'1893',period:'现代',place:'国家美术馆 · 奥斯陆',img:'https://commons.wikimedia.org/wiki/Special:FilePath/The_Scream.jpg?width=1200'},
{title:'神奈川冲浪里',en:'The Great Wave off Kanagawa',artist:'葛饰北斋',year:'约 1831',period:'现代',place:'日本浮世绘',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Tsunami_by_hokusai_19th_century.jpg?width=1200'}
];let shown=[...artworks],current=0;const grid=document.querySelector('#grid'),modal=document.querySelector('#modal');
function render(){grid.innerHTML='';shown.forEach((a,i)=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="image-wrap"><img loading="lazy" src="${a.img}" alt="${a.title}，${a.artist}"/><span class="zoom" aria-hidden="true">⤢</span></div><div class="meta"><div><h2 class="title">${a.title}</h2><div class="artist">${a.artist}</div><div class="tag">${a.period} · ${a.place}</div></div><div class="year">${a.year}</div></div>`;card.onclick=()=>open(i);grid.append(card)});document.querySelector('#count').textContent=`${String(shown.length).padStart(2,'0')} 件作品`}
function open(i){current=i;updateModal();modal.classList.add('open');document.body.style.overflow='hidden'}function updateModal(){const a=shown[current];document.querySelector('#modalImg').src=a.img;document.querySelector('#modalImg').alt=a.title;document.querySelector('#caption').innerHTML=`${a.title} <span>${a.en} · ${a.artist} · ${a.year}</span>`}function close(){modal.classList.remove('open');document.body.style.overflow=''}function step(n){current=(current+n+shown.length)%shown.length;updateModal()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelector('.tab.active').classList.remove('active');b.classList.add('active');shown=b.dataset.filter==='全部'?artworks:artworks.filter(a=>a.period===b.dataset.filter);render()});document.querySelector('.close').onclick=close;document.querySelector('.prev').onclick=()=>step(-1);document.querySelector('.next').onclick=()=>step(1);modal.onclick=e=>{if(e.target===modal)close()};document.addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});render();
</script></body></html>
